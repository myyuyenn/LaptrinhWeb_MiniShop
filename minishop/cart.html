<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MiniShop</title>
</head>
<body>

    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>

        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <!-- NỘI DUNG -->
    <main>
        <h2>Giỏ hàng</h2>

        <table class="cart-table" border="1">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Chuột không dây M1</td>
                    <td>250.000 đ</td>
                    <td>
                        <input type="number" min="1" value="1">
                    </td>
                    <td>250.000 đ</td>
                </tr>

                <tr>
                    <td>Bàn phím cơ K2</td>
                    <td>790.000 đ</td>
                    <td>
                        <input type="number" min="1" value="1">
                    </td>
                    <td>790.000 đ</td>
                </tr>

                <tr>
                    <td colspan="3">
                        <strong>Tổng tiền</strong>
                    </td>
                    <td>
                        <strong>1.040.000<strong>
                    </td>
                </tr>
            </tbody>
        </table>

        <br>

        <button type="button">Đặt hàng</button>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>

</body>
</html>
