<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MiniShop</title>
</head>

<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <main>
        <h2>Đăng nhập tài khoản</h2>
        <form action="login.html" method="get" class="form">
            <p>
                <lable for="email">Email</lable><br>
                <input type="email" id="email" name="email" required placeholder="ten@example.com">
            </p>
            <p>
                <lable for="password">Mật khẩu</lable><br>
                <input type="password" id="password" name="password" required minlength="6">
            </p>
            <p>
                <input type="checkbox" id="agree" name="agree" value="1" required>
                <lable for="agree">Ghi nhớ đăng nhập</lable>
            </p>
            <p>
                <button type="submit">Đăng nhập</button>
            </p>
            <p><a href="register.html">&laquo; Chưa có tài khoản? Đăng ký</a></p>
        </form>
    </main>



    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>

</html>
